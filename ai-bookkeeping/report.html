<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report</title>
<style>
  :root { --fg: #181d27; --muted: #535862; --line: #e9eaeb; --soft: #fafafa; --bad: #b42318; --good: #067647; --warn: #b54708; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--fg); background: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 40px 0 12px; padding-top: 8px; border-top: 1px solid var(--line); }
  .sub { color: var(--muted); margin: 0 0 16px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
  nav a { color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .badge { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  ul.fails { margin: 8px 0 0; padding-left: 20px; color: var(--bad); }
  ul.warns { margin: 8px 0 0; padding-left: 20px; color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--soft); position: sticky; top: 0; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  td:first-child { white-space: nowrap; }
  tr.total td { font-weight: 600; border-top: 2px solid var(--fg); }
  .wrap { overflow-x: auto; }
  .empty { color: var(--muted); font-style: italic; }
  td a { color: inherit; text-underline-offset: 2px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
  .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 20px; margin-top: 2px; }
  .kpi span { color: var(--muted); font-size: 12px; }
  /* Expandable rows: account, then party, then bookings in a soft panel. Children indent to the parent's label. */
  details { border-bottom: 1px solid var(--line); }
  details[open] { padding-bottom: 12px; }
  details > details { margin-left: 18px; }
  details > div { margin-left: 8px; }
  details details { border-bottom: 0; }
  details details[open] { padding-bottom: 6px; }
  summary { cursor: pointer; display: flex; align-items: baseline; gap: 10px; padding: 10px 8px; list-style: none; border-radius: 8px; }
  details details > summary { padding: 7px 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: ""; flex: none; width: 6px; height: 6px; margin-left: 2px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(-45deg); transition: transform .15s; }
  details[open] > summary::before { transform: translateY(-3px) rotate(45deg); }
  details[open] > summary > span:first-child { font-weight: 600; }
  summary:hover { background: var(--soft); }
  summary:focus { outline: none; }
  summary:focus-visible { outline: 2px solid #84adff; outline-offset: -2px; }
  details .wrap { background: var(--soft); border-radius: 10px; padding: 2px 12px; margin: 2px 0 6px; }
  details th { background: transparent; position: static; }
  details tr:last-child td { border-bottom: 0; }
  details .empty { margin: 4px 0 8px; font-size: 13px; }
  summary b { margin-left: auto; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #pnl table { table-layout: fixed; } #pnl th:first-child { width: 72px; } #pnl th:nth-child(2) { width: 34%; }
  .result { margin-top: 20px; } .result td { font-size: 15px; }
  summary span.muted { color: var(--muted); font-weight: 400; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .filters input, .filters select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .filters input { flex: 1; min-width: 200px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px; }
  @media print { nav, summary::before { display: none; } details > * { display: block; } h2 { break-before: auto; } th { position: static; } main { padding: 0; } }
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("report-data").textContent);
  var m = data.meta;
  var de = m.lang === "de";
  var L = de ? {
    title: "Buchhaltung", period: "Zeitraum", ready: "Bereit für die Steuerberatung", notReady: "Noch nicht fertig",
    reconciled: "Summen stimmen", notReconciled: "Summen stimmen nicht", pnl: "Gewinn und Verlust",
    pnlCash: "Einnahmen und Ausgaben", bs: "Bilanz", bsCash: "Kontensalden", vat: "Umsatzsteuer", items: "Offene Posten",
    assets: "Anlagenverzeichnis", missing: "Buchungen ohne Beleg", tb: "Summen- und Saldenliste", account: "Konto",
    code: "Nr.", name: "Bezeichnung", total: "Summe", result: "Ergebnis", income: "Erträge", expenses: "Aufwendungen", incomeCash: "Einnahmen", expensesCash: "Ausgaben",
    assetsSide: "Aktiva", liabilities: "Verbindlichkeiten", equity: "Eigenkapital", opening: "Anfang", debit: "Soll",
    credit: "Haben", closing: "Ende", direction: "Richtung", sale: "Umsatz", purchase: "Einkauf", regime: "Behandlung",
    rate: "Satz", base: "Bemessung", tax: "USt", inputTax: "Vorsteuer", payable: "Zahllast", codes: "Kennzahlen",
    party: "Partner", number: "Nummer", date: "Datum", due: "Fällig", amount: "Betrag", open: "Offen", overdue: "Tage überfällig",
    receivable: "Forderung", payableSide: "Verbindlichkeit", cost: "Anschaffung", prior: "AfA bisher", thisYear: "AfA dieses Jahr",
    booked: "Gebucht", count: "Anzahl", vatBookings: "Buchungen je Zeitraum", bookValue: "Buchwert Ende", none: "Keine Einträge", booking: "Buchung", notFiling: "Zusammenfassung, keine Steuererklärung.",
    source: "Erstellt aus", resultYear: "Ergebnis des Geschäftsjahres", taxes: "Steuern", taxType: "Steuer",
    taxGeneric: "Steuer", types: { vat: "USt", gst: "GST", sales_tax: "Sales Tax", other: "Andere" },
    drill: "Konten im Detail", bookings: "Buchungen", bookingOne: "Buchung", noParty: "Ohne Partner", text: "Text", document: "Beleg", byParty: "Nach Partner",
    firstBookings: "Einzelne Buchungen", jurisdiction: "Steuergebiet", useTax: "Use Tax",
    regimes: { standard: "Normal", reverse_charge: "Reverse Charge", intra_community: "Innergemeinschaftlich",
      exempt: "Steuerfrei", zero: "Nullsatz", export: "Ausfuhr", out_of_scope: "Nicht steuerbar", import: "Einfuhr" },
    search: "Buchungen", searchHint: "Suchen: Partner, Text, Betrag, Konto", allAccounts: "Alle Konten",
    shown: function (n, all) { return n + " von " + all + " Buchungszeilen"; },
    more: function (n) { return "und " + n + " weitere, in journal.csv oder über die Suche"; },
    taxForm: "Steuerformular (Entwurf)", draft: "Entwurf für die Steuerberatung, keine Steuererklärung.",
    line: m.country === "AT" ? "Kennzahl" : "Zeile", unmapped: "Konten ohne Zeile, die ordnet die Steuerberatung zu",
    notDeductible: "Nicht abzugsfähig"
  } : {
    title: "Books", period: "Period", ready: "Ready for your accountant", notReady: "Not ready yet",
    reconciled: "Totals reconcile", notReconciled: "Totals do not reconcile", pnl: "Profit and loss",
    pnlCash: "Income and expenses", bs: "Balance sheet", bsCash: "Account balances", vat: "VAT", items: "Open items",
    assets: "Asset register", missing: "Bookings without a receipt", tb: "Trial balance", account: "Account",
    code: "Code", name: "Name", total: "Total", result: "Result", income: "Income", expenses: "Expenses", incomeCash: "Income", expensesCash: "Expenses",
    assetsSide: "Assets", liabilities: "Liabilities", equity: "Equity", opening: "Opening", debit: "Debit",
    credit: "Credit", closing: "Closing", direction: "Direction", sale: "Sales", purchase: "Purchases", regime: "Treatment",
    rate: "Rate", base: "Base", tax: "Output tax", inputTax: "Input tax", payable: "Payable", codes: "Report codes",
    party: "Party", number: "Number", date: "Date", due: "Due", amount: "Amount", open: "Open", overdue: "Days overdue",
    receivable: "Receivable", payableSide: "Payable", cost: "Cost", prior: "Depreciated before", thisYear: "This year",
    booked: "Booked", count: "Count", vatBookings: "Bookings by period", bookValue: "Book value at end", none: "Nothing here", booking: "Booking", notFiling: "A summary, not a filing.",
    source: "Built from", resultYear: "Result for the fiscal year", taxes: "Taxes", taxType: "Tax",
    taxGeneric: "Tax collected", types: { vat: "VAT", gst: "GST", sales_tax: "Sales tax", other: "Other" },
    drill: "Accounts in detail", bookings: "bookings", bookingOne: "booking", noParty: "No party", text: "Description", document: "Document", byParty: "By party",
    firstBookings: "Single bookings", jurisdiction: "Jurisdiction", useTax: "Use tax",
    regimes: { standard: "Standard", reverse_charge: "Reverse charge", intra_community: "Intra-EU", exempt: "Exempt",
      zero: "Zero-rated", export: "Export", out_of_scope: "Out of scope", import: "Import" },
    search: "Bookings", searchHint: "Search: party, text, amount, account", allAccounts: "All accounts",
    shown: function (n, all) { return n + " of " + all + " booking lines"; },
    more: function (n) { return "and " + n + " more, in journal.csv or through the search"; },
    taxForm: "Tax form (draft)", draft: "A draft for your accountant, not a filing.",
    line: "Line", unmapped: "Accounts without a line, your accountant assigns them", notDeductible: "Not deductible"
  };
  // de-AT groups thousands with a space; Austrian accountants write 1.234,56 like German ones.
  var locale = de ? "de-DE" : "en-GB";
  var digits = typeof m.precision === "number" ? m.precision : 2;
  var nf = new Intl.NumberFormat(locale, { minimumFractionDigits: digits, maximumFractionDigits: digits });
  function day(d) { return de && /^\d{4}-\d{2}-\d{2}$/.test(d || "") ? d.slice(8, 10) + "." + d.slice(5, 7) + "." + d.slice(0, 4) : d || ""; }
  var pct = de ? " %" : "%";
  var acctNames = {};
  data.trial_balance.forEach(function (r) { acctNames[r.account] = [r.code, r.name].filter(Boolean).join(" "); });
  function acctName(a) { return acctNames[a] || a; }
  var vatOnly = (data.vat.types || []).every(function (t) { return t === "vat"; });
  var salesOnly = (data.vat.types || []).length > 0 && data.vat.types.every(function (t) { return t === "sales_tax"; });
  var vatTitle = vatOnly ? L.vat : salesOnly ? L.types.sales_tax : L.taxes;
  var withJur = data.vat.lines.some(function (r) { return r.jurisdiction; });
  function num(v) { return v === null || v === undefined || v === "" ? "" : nf.format(Number(v) || 0); }
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) { for (var k in attrs) { if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } }
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  // numeric[i]: true formats an amount, "right" only right-aligns the cell.
  function table(head, rows, numeric, totalRow) {
    var wrap = el("div", { class: "wrap" });
    if (!rows.length) { wrap.appendChild(el("p", { class: "empty" }, L.none)); return wrap; }
    var t = el("table"), thead = el("thead"), tr = el("tr");
    head.forEach(function (h, i) { tr.appendChild(el("th", numeric[i] ? { class: "n" } : null, h)); });
    thead.appendChild(tr); t.appendChild(thead);
    var tb = el("tbody");
    rows.concat(totalRow ? [totalRow] : []).forEach(function (r, ri) {
      var row = el("tr", totalRow && ri === rows.length ? { class: "total" } : null);
      r.forEach(function (c, i) {
        if (c instanceof Node) { var td = el("td"); td.appendChild(c); row.appendChild(td); return; }
        row.appendChild(el("td", numeric[i] ? { class: "n" } : null, numeric[i] === true ? num(c) : c));
      });
      tb.appendChild(row);
    });
    t.appendChild(tb); wrap.appendChild(t); return wrap;
  }
  function section(id, title) {
    var s = el("section", { id: id }); s.appendChild(el("h2", null, title)); app.appendChild(s);
    nav.appendChild(el("a", { href: "#" + id }, title));
    return s;
  }
  function plain(line) { return String(line).replace(/^[a-z0-9_]+: /, ""); }
  function docCell(id, url) {
    if (!url || !/^https?:\/\//.test(url)) return id;
    return el("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, id || url);
  }
  function sum(rows, f) { return rows.reduce(function (a, r) { return a + Number(f(r) || 0); }, 0); }
  function periodOf(d, by) {
    return by === "month" ? d.slice(0, 7) : by === "quarter" ? d.slice(0, 4) + "-Q" + (Math.floor((Number(d.slice(5, 7)) - 1) / 3) + 1) : d.slice(0, 4);
  }
  var LIMIT = 200, SHOWN = 50;
  function lines(rows, sign, amountLabel) {
    var box = el("div");
    box.appendChild(table([L.date, L.party, L.text, L.document, amountLabel || L.amount], rows.slice(0, LIMIT).map(function (j) {
      return [day(j.date), j.payee, j.narration, docCell(j.document, j.document_url), sign * Number(j.amount)];
    }), [false, false, false, false, true]));
    if (rows.length > LIMIT) box.appendChild(el("p", { class: "empty" }, L.more(rows.length - LIMIT)));
    return box;
  }
  // One row per party, then that party's bookings. Postings of one booking on the same account add up to one line.
  function byParty(rows, sign) {
    var parties = {}, list = [];
    rows.forEach(function (j) {
      var name = j.payee || L.noParty, p = parties[name];
      if (!p) { p = parties[name] = { name: name, total: 0, txns: {}, keys: [] }; list.push(p); }
      var key = j.txn_id || j.date + "|" + j.narration;
      if (!p.txns[key]) { p.txns[key] = { date: j.date, text: j.narration, document: j.document, url: j.document_url, amount: 0 }; p.keys.push(key); }
      p.txns[key].amount += sign * Number(j.amount); p.total += sign * Number(j.amount);
    });
    return list.sort(function (a, b) { return Math.abs(b.total) - Math.abs(a.total); }).map(function (p) {
      var d = el("details"), sm = el("summary"), label = el("span", null, p.name);
      label.appendChild(el("span", { class: "muted" }, " · " + p.keys.length + " " + (p.keys.length === 1 ? L.bookingOne : L.bookings)));
      sm.appendChild(label); sm.appendChild(el("b", null, num(p.total))); d.appendChild(sm);
      d.appendChild(table([L.date, L.text, L.document, L.amount], p.keys.slice(0, LIMIT).map(function (k) {
        var t = p.txns[k]; return [day(t.date), t.text, docCell(t.document, t.url), t.amount];
      }), [false, false, false, true]));
      if (p.keys.length > LIMIT) d.appendChild(el("p", { class: "empty" }, L.more(p.keys.length - LIMIT)));
      return d;
    });
  }
  // Built on first open, so a large ledger renders fast. `flat` (true, or a label for the amount column) lists bookings without the party level.
  function drill(label, amount, rows, sign, flat) {
    var d = el("details"), sm = el("summary");
    sm.appendChild(el("span", null, label)); sm.appendChild(el("b", null, num(amount))); d.appendChild(sm);
    d.addEventListener("toggle", function once() {
      if (!d.open || d.childNodes.length > 1) return;
      if (flat) d.appendChild(lines(rows, sign, flat === true ? null : flat));
      else byParty(rows, sign).forEach(function (c) { d.appendChild(c); });
    });
    return d;
  }
  var byAcct = {};
  data.journal.forEach(function (j) { (byAcct[j.account] = byAcct[j.account] || []).push(j); });

  var app = document.getElementById("app");
  var cash = m.basis === "cash";
  if (cash) { L.income = L.incomeCash; L.expenses = L.expensesCash; }
  document.title = (m.title || L.title) + " " + day(m.from) + " – " + day(m.to);
  app.appendChild(el("h1", null, m.title || L.title));
  app.appendChild(el("p", { class: "sub" }, L.period + ": " + day(m.from) + " – " + day(m.to) + " · " + m.currency));
  var badges = el("div", { class: "badges" });
  badges.appendChild(el("span", { class: "badge " + (m.ready ? "good" : "bad") }, m.ready ? L.ready : L.notReady));
  badges.appendChild(el("span", { class: "badge " + (m.reconciled ? "good" : "bad") }, m.reconciled ? L.reconciled : L.notReconciled));
  if (m.missing_receipts_count) badges.appendChild(el("span", { class: "badge warn" }, L.missing + ": " + m.missing_receipts_count));
  app.appendChild(badges);
  if (m.fails && m.fails.length) {
    var ul = el("ul", { class: "fails" });
    m.fails.forEach(function (f) { ul.appendChild(el("li", null, plain(f))); });
    app.appendChild(ul);
  }
  if (m.warnings && m.warnings.length) {
    var wl = el("ul", { class: "warns" });
    m.warnings.forEach(function (w) { wl.appendChild(el("li", null, plain(w))); });
    app.appendChild(wl);
  }
  var nav = el("nav");
  app.appendChild(nav);

  var income = data.pnl.filter(function (r) { return r.group === "Income"; });
  var expenses = data.pnl.filter(function (r) { return r.group === "Expenses"; });
  var kpis = el("div", { class: "kpis" });
  [[L.income, sum(income, function (r) { return r.total; })], [L.expenses, -sum(expenses, function (r) { return r.total; })],
   [L.result, Number(m.result)]].forEach(function (k) {
    var box = el("div", { class: "kpi" }); box.appendChild(el("span", null, k[0])); box.appendChild(el("b", null, num(k[1])));
    kpis.appendChild(box);
  });
  app.appendChild(kpis);

  var cols = m.columns, quarters = [];
  if (cols.length === 1) {
    for (var dq = new Date(m.from + "T00:00:00Z"); dq.toISOString().slice(0, 10) <= m.to; dq.setUTCMonth(dq.getUTCMonth() + 1)) {
      var qk = periodOf(dq.toISOString().slice(0, 10), "quarter");
      if (quarters.indexOf(qk) < 0) quarters.push(qk);
    }
    if (quarters.length > 1) cols = quarters; else quarters = [];
  }
  function values(r) {
    if (!quarters.length) return r.values;
    return quarters.map(function (qk) {
      return -sum((byAcct[r.account] || []).filter(function (j) { return periodOf(j.date, "quarter") === qk; }), function (j) { return j.amount; });
    });
  }
  var s = section("pnl", cash ? L.pnlCash : L.pnl);
  [[L.income, income, 1], [L.expenses, expenses, -1]].forEach(function (g) {
    s.appendChild(el("h3", null, g[0]));
    var rows = g[1].map(function (r) {
      return [r.code, r.name].concat(values(r).map(function (v) { return g[2] * Number(v); })).concat([g[2] * Number(r.total)]);
    });
    var head = [L.code, L.name].concat(cols.length > 1 ? cols : []).concat([L.total]);
    var numeric = [false, false].concat(cols.length > 1 ? cols.map(function () { return true; }) : []).concat([true]);
    if (cols.length === 1) rows = rows.map(function (r) { return [r[0], r[1], r[r.length - 1]]; });
    var tot = [L.total, ""].concat(numeric.slice(2).map(function (_, i) { return sum(rows, function (r) { return r[i + 2]; }); }));
    s.appendChild(table(head, rows, numeric, tot));
  });

  if (data.pnl.length) {
    // One row per booking under each account, with only that account's postings: the bank leg never adds in.
    s = section("drill", L.drill);
    [[L.income, income], [L.expenses, expenses]].forEach(function (g) {
      if (!g[1].length) return;
      s.appendChild(el("h3", null, g[0]));
      g[1].forEach(function (r) {
        var rows = byAcct[r.account] || [], sign = r.group === "Income" ? -1 : 1;
        s.appendChild(drill([r.code, r.name].filter(Boolean).join(" "), sign * sum(rows, function (j) { return j.amount; }), rows, sign));
      });
    });
  }

  function totalLine(label, amount, cls) {
    var wrap = el("div", { class: "wrap" + (cls ? " " + cls : "") }), t = el("table"), tr = el("tr", { class: "total" });
    tr.appendChild(el("td", null, label)); tr.appendChild(el("td", { class: "n" }, num(amount)));
    t.appendChild(tr); wrap.appendChild(t); return wrap;
  }
  s = section("bs", cash ? L.bsCash : L.bs);
  var bs = data.balance_sheet;
  [[L.assetsSide, bs.assets, bs.assets_total], [L.liabilities, bs.liabilities, bs.liabilities_total],
   [L.equity, bs.equity, bs.equity_total]].forEach(function (g) {
    s.appendChild(el("h3", null, g[0]));
    var sign = g[1] === bs.assets ? 1 : -1;
    if (!g[1].length) s.appendChild(el("p", { class: "empty" }, L.none));
    g[1].forEach(function (r) {
      s.appendChild(drill([r.code, r.name].filter(Boolean).join(" "), r.amount, byAcct[r.account] || [], sign));
    });
    s.appendChild(totalLine(L.total, g[2]));
  });
  s.appendChild(totalLine(L.resultYear, bs.result, "result"));

  function typeName(t) { return L.types[t] || t; }
  function regimeName(r) { return r.type === "sales_tax" && r.regime === "reverse_charge" ? L.useTax : L.regimes[r.regime] || r.regime; }
  // Columns: period, tax type (only with more than one), jurisdiction (only when any row has one), then the rest.
  var oneType = (data.vat.types || []).length <= 1;
  function jur(cells, r) {
    var c = withJur ? cells.slice(0, 2).concat([r.jurisdiction || ""], cells.slice(2)) : cells;
    return oneType ? c.slice(0, 1).concat(c.slice(2)) : c;
  }
  if (data.vat.lines.length || data.vat.totals.length) {
    s = section("vat", vatTitle);
    s.appendChild(el("p", { class: "sub" }, L.notFiling));
    s.appendChild(table(jur([L.period, L.taxType, L.direction, L.regime, L.rate, L.base, vatOnly ? L.tax : L.taxGeneric, L.inputTax], { jurisdiction: L.jurisdiction }),
      data.vat.lines.map(function (r) { return jur([r.period, typeName(r.type), r.direction === "sale" ? L.sale : L.purchase, regimeName(r), r.rate + pct, r.base, r.tax, r.input_tax], r); }),
      jur([false, false, false, false, "right", true, true, true], { jurisdiction: false })));
    s.appendChild(el("h3", null, L.payable));
    var withDue = data.vat.totals.some(function (r) { return r.due; });
    var dueCol = function (cells, r) { return withDue ? cells.concat([r ? day(r.due) : L.due]) : cells; };
    s.appendChild(table(dueCol(jur([L.period, L.taxType, vatOnly ? L.tax : L.taxGeneric, L.inputTax, L.payable], { jurisdiction: L.jurisdiction })),
      data.vat.totals.map(function (r) { return dueCol(jur([r.period, typeName(r.type), r.tax, r.input_tax, r.payable], r), r); }),
      jur([false, false, true, true, true], { jurisdiction: false }).concat(withDue ? ["right"] : [])));
    var taxed = data.journal.filter(function (j) { return j.tax_regime && !j.tax_part; });
    var perPeriod = data.vat.totals.map(function (r) {
      var rows = taxed.filter(function (j) { return j.tax_type === r.type && periodOf(j.tax_point || j.date, data.vat.period) === r.period; });
      return rows.length ? drill(r.period + (oneType ? "" : " · " + typeName(r.type)) + (r.jurisdiction ? " " + r.jurisdiction : ""), r.payable, rows, -1, L.base) : null;
    }).filter(Boolean);
    if (perPeriod.length) {
      s.appendChild(el("h3", null, L.vatBookings));
      perPeriod.forEach(function (d) { s.appendChild(d); });
    }
    if (data.vat.codes.length) {
      s.appendChild(el("h3", null, L.codes));
      s.appendChild(table([L.period, L.code, L.amount], data.vat.codes.map(function (r) { return [r.period, r.code, r.amount]; }),
        [false, false, true]));
    }
  }

  if (data.open_items.length) {
    s = section("items", L.items);
    s.appendChild(table([L.party, L.number, L.date, L.due, L.amount, L.open, L.overdue, ""],
      data.open_items.map(function (r) {
        return [r.party, r.number, day(r.date), day(r.due), r.amount, r.open, String(r.days_overdue), r.side === "receivable" ? L.receivable : L.payableSide];
      }), [false, false, false, false, true, true, "right", false]));
  }

  if (data.assets.length) {
    s = section("assets", L.assets);
    s.appendChild(table([L.name, L.cost, L.prior, L.thisYear, L.booked, L.bookValue],
      data.assets.map(function (r) { return [r.description || r.asset, r.cost, r.prior, r.due, r.booked, r.book_value_end]; }),
      [false, true, true, true, true, true]));
  }

  if (m.missing_receipts_count) {
    s = section("missing", L.missing);
    s.appendChild(el("h3", null, L.byParty));
    s.appendChild(table([L.party, L.count, L.amount], data.missing_receipts_by_party.map(function (r) {
      return [r.payee, String(r.count), r.amount];
    }), [false, "right", true]));
    s.appendChild(el("h3", null, L.firstBookings));
    s.appendChild(table([L.date, L.party, L.text, L.account, L.amount], data.missing_receipts.map(function (r) {
      return [day(r.date), r.payee, r.narration, acctName(r.account), r.amount];
    }), [false, false, false, false, true]));
  }

  var tf = data.tax_form;
  if (tf) {
    s = section("taxform", L.taxForm + ": " + tf.form);
    s.appendChild(el("p", { class: "sub" }, L.draft));
    s.appendChild(table([L.line, L.name, L.amount], tf.lines.map(function (r) { return [r.line, r.name, r.amount]; }), [false, false, true]));
    [[L.unmapped, tf.unmapped], [L.notDeductible, tf.not_deductible]].forEach(function (g) {
      if (!g[1].length) return;
      s.appendChild(el("h3", null, g[0]));
      s.appendChild(table([L.name, L.amount], g[1].map(function (r) { return [r.name || r.account, r.amount]; }), [false, true]));
    });
  }

  if (data.journal.length) {
    s = section("bookings", L.search);
    var bar = el("div", { class: "filters" }), q = el("input", { type: "search", placeholder: L.searchHint, "aria-label": L.searchHint });
    var pick = el("select", { "aria-label": L.account });
    pick.appendChild(el("option", { value: "" }, L.allAccounts));
    Object.keys(byAcct).sort(function (a, b) { return acctName(a).localeCompare(acctName(b), locale, { numeric: true }); })
      .forEach(function (a) { pick.appendChild(el("option", { value: a }, acctName(a))); });
    bar.appendChild(q); bar.appendChild(pick); s.appendChild(bar);
    var count = el("p", { class: "sub" }), out = el("div");
    s.appendChild(count); s.appendChild(out);
    var hay = data.journal.map(function (j) {
      return [j.date, day(j.date), j.payee, j.narration, j.account, acctName(j.account), j.document, j.amount, String(j.amount).replace(".", ","), num(j.amount)].join(" ").toLowerCase();
    });
    var render = function () {
      var words = q.value.toLowerCase().split(/\s+/).filter(Boolean), acct = pick.value;
      var hits = data.journal.filter(function (j, i) {
        return (!acct || j.account === acct) && words.every(function (w) { return hay[i].indexOf(w) >= 0; });
      });
      count.textContent = L.shown(Math.min(hits.length, SHOWN), hits.length);
      out.replaceChildren(table([L.date, L.party, L.text, L.account, L.document, L.amount], hits.slice(0, SHOWN).map(function (j) {
        return [day(j.date), j.payee, j.narration, acctName(j.account), docCell(j.document, j.document_url), j.amount];
      }), [false, false, false, false, false, true]));
    };
    q.addEventListener("input", render); pick.addEventListener("change", render); render();
  }

  s = section("tb", L.tb);
  s.appendChild(table([L.code, L.name, L.opening, L.debit, L.credit, L.closing],
    data.trial_balance.map(function (r) { return [r.code, r.name, r.opening, r.debit, r.credit, r.closing]; }),
    [false, false, true, true, true, true],
    [L.total, "", "", data.trial_totals.debit, data.trial_totals.credit, ""]));

  var foot = el("footer", null, L.source + " " + m.file + " (v" + m.version + ", sha256 " + String(m.sha256).slice(0, 12) + ")");
  app.appendChild(foot);
})();
